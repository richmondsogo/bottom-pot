    <title>Strategic Initiatives @ Plaid</title><meta name="title" content="Strategic Initiatives @ Plaid" />
    
  
  <meta name="description" content="We believe that the way people interact with their finances will drastically improve in the next few years. We’re dedicated to empowering this transformation by building the tools and experiences that thousands of developers use to create their own products. Plaid powers the tools millions of people rely on to live a healthier financial life. We work with thousands of companies like Venmo, SoFi, several of the Fortune 500, and many of the largest banks to make it easy for people to connect their financial accounts to the apps and services they want to use. Plaid’s network covers 12,000 financial institutions across the US, Canada, UK and Europe. Founded in 2013, the company is headquartered in San Francisco with offices in New York, Seattle, Washington D.C., Raleigh, London, and Amsterdam.

Responsibilities:

 - Work directly with leaders across Plaid on the company&#39;s most important and least-defined problems, particularly those at the seams of multiple teams or functions

 - Identify unowned, high-leverage opportunities across the business and driving them to clean outcomes

 - Operate across a wide aperture (strategy, GTM, operations, product, etc.) without being boxed into a single lane

 - Lead (directly or indirectly) high performing teams

 - Use AI tools and agents as a default part of how you work — not as an experiment, but as a force multiplier

Qualifications:

 - 10+ years of total experience, with meaningful time in consulting as well as direct operating roles (BizOps, Strategy &amp; Ops, Finance, Chief of Staff, etc.

 - A track record of independently identifying problems and driving them to outcomes with limited top-down direction

 - High agency, sense of ownership, and willingness to roll up your sleeves

 - Ability to build relationships at all levels and drive cross-functional teams to action

 - Strong analytical and structured-thinking skills; comfort translating ambiguity into frameworks, plans, and decisions

 - Experience directly managing high-performing teams

 - Familiarity with AI tools and agents to accelerate workflows is a plus

 - Knowledge of SQL and Tableau preferred

 - Experience in fintech, payments, or high-growth SaaS preferred

Our mission at Plaid is to unlock financial freedom for everyone. To support that mission, we seek to build a diverse team of driven individuals who care deeply about making the financial ecosystem more equitable. We recognize that strong qualifications can come from both prior work experiences and lived experiences. We encourage you to apply to a role even if your experience doesn&#39;t fully match the job description. We are always looking for team members that will bring something unique to Plaid!

Plaid is proud to be an equal opportunity employer and values diversity at our company. We do not discriminate based on race, color, national origin, ethnicity, religion or religious belief, sex (including pregnancy, childbirth, or related medical conditions), sexual orientation, gender, gender identity, gender expression, transgender status, sexual stereotypes, age, military or veteran status, disability, or other applicable legally protected characteristics. We also consider qualified applicants with criminal histories, consistent with applicable federal, state, and local laws. Plaid is committed to providing reasonable accommodations for candidates with disabilities in our recruiting process. If you need any assistance with your application or interviews due to a disability, please let us know at accommodations@plaid.com.

Please review our Candidate Privacy Notice here https://plaid.com/legal/#candidate-privacy-notice.


Additional compensation in the form(s) of equity and/or commission are dependent on the position offered. Plaid provides a comprehensive benefit plan, including medical, dental, vision, and 401(k). Pay is based on factors such as (but not limited to) scope and responsibilities of the position, candidate&#39;s work experience and skillset, and location. Pay and benefits are subject to change at any time, consistent with the terms of any applicable compensation or benefit plans." />
