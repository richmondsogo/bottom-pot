    <meta name="description" property="og:description" content="Deloitte est présente sur l’ensemble du continent africain notamment en Afrique francophone : en Afrique du Nord, en Afrique de l’Ouest et en Afrique centrale et dispose de 9 bureaux avec une capacité d&#39;intervention sur 19 pays Deloitte mobilise plus de 1 400 collaborateurs dans les activités de Consulting, d’Audit Assurance, de conseil Juridique et Fiscal, de Risk Advisory, de Financial Advisory et de Business Outsourcing. Quel sera votre rôle dans la #TeamDeloitte ? En tant que Consultant(e) Full Stack Technologie Expérimenté(e)/Confirmé(e) vous interviendrez sur divers secteurs d’activité et diverses missions, notamment : Concevoir et développer des full-stack features sur notre front-end React/Next.js et notre back-end Python/FastAPI, afin de supporter des agentic, AI-native workflows. Concevoir l’architecture de agentic systems: multi-agent orchestration, tool-calling, RAG, structured outputs, guardrails, evals et human-in-the-loop checkpoints. Stimuler l’innovation en expérimentant de nouveaux models, techniques et technologies, tout en restant à jour sur les dernières avancées en AI. Concevoir et maintenir les APIs, data models et integrations avec des SQL et NoSQL data stores. Collaborer de manière cross-functional avec les designers, product managers et autres engineers afin de fournir des software solutions complètes. Optimiser les performances des applications grâce au caching, load balancing et à la conception d’une scalable architecture. Développer des unit tests et integration tests afin de garantir la qualité et la fiabilité du code ; participer au debugging et troubleshooting. Gérer les continuous integration and deployment pipelines (CI/CD) afin d’automatiser les tests et d’assurer des releases fluides. Documenter les APIs, system architecture et codebase afin de faciliter la maintenance et la scalability futures. Deloitte construit la prochaine génération d’enterprise AI : des digital teammates capables d’automatiser les tâches que les humains ne devraient pas avoir à effectuer, en commençant par la Finance et en s’étendant progressivement à l’ensemble des fonctions back-office. Né au sein de Deloitte et désormais soutenu par le cabinet, Delo construit le Deloitte 2.0 : une version entièrement digitale et AI-native du cabinet. Notre plateforme orchestre des agentic AI, structured SOPs et automated workflows à travers les ERPs, CRMs, tax engines et financial systems. Imaginez un reusable, multi-agent operating system dédié aux activités des entreprises. Nous sommes encore à un stade très précoce, véritablement 0→1, et nous construisons aujourd’hui une scalable engineering foundation qui permettra de faire fonctionner des dizaines d’agents, des milliers d’équipes et des millions de tâches automatisées. Si vous souhaitez construire les foundational infrastructure qui permettra de transformer le travail grâce à l’AI pour des milliers d’organisations, c’est le moment idéal pour nous rejoindre. Et si c’était vous ? Vous disposez de 10+ années d’expérience en software engineering, avec une solide expérience front-end en React/Next.js et une expérience back-end en Python/FastAPI ou dans un autre modern web framework. Vous avez démontré votre capacité à concevoir et exploiter des production systems at scale et à établir un technical bar élevé pour les autres engineers. Vous avez une expérience des event-driven architectures permettant d’orchestrer des long-running agent runs et de decouple services. Vous maîtrisez le relational data modeling (PostgreSQL) ainsi que les technologies NoSQL (MongoDB, Elasticsearch). Vous avez une solide expérience dans la conception d’APIs et dans l’intégration propre et sécurisée des composants front-end et back-end ; vous maîtrisez le secure coding, authentication, reusability et performance. Vous avez déployé des LLM-powered features en production et comprenez les réalités liées au non-determinism : prompting, evals, retries, fallbacks et guardrails. Vous utilisez couramment les AI coding assistants (Cursor, Claude Code, Codex) comme outils de travail au quotidien. Vous êtes un clear communicator, avec une forte attention aux détails, et vous êtes attaché à produire du code clean, maintainable et testable. Nice to haves Expérience dans la construction de agentic systems et expérience pratique du RAG avec des vector DBs (pgvector, Elasticsearch, Milvus). Expérience dans la mise en place d’un LLM eval pipeline et bonne connaissance du tool use, function calling, MCP et structured outputs. Expérience des cloud platforms (AWS, Azure, GCP), des containers (Docker, Kubernetes) et des principes DevOps / Infrastructure as Code. Connaissance de la data governance, AI ethics et des compliance frameworks (SOC 2, GDPR, HIPAA). Une expérience préalable en startup ou SaaS, notamment dans les domaines de la fintech, accounting ou ERP/CRM, serait un plus. Leader mondial en Conseil &amp;amp; Audit, Deloitte propose l’offre de service pluridisciplinaire la plus complète du marché. Fort d’un réseau mondial implanté dans plus de 150 pays, notre firme allie des compétences de niveau international à un service de grande qualité afin d’aider nos clients à répondre à leurs problématiques les plus complexes. Véritable partenaire de confiance, nous accompagnons les entreprises de toutes tailles et de tous secteurs d’activités dans leurs enjeux de croissance et de transformation. Rejoindre Deloitte, c’est dire oui à une expérience qui a du sens, celle où les rencontres et les missions vous poussent à grandir chaque jour. C’est évoluer dans un environnement de travail fondé sur la confiance, la transmission et l’intelligence collective pour construire l’avenir de nos clients. Nous rejoindre, c’est aussi dire oui à une entreprise Great Place To Work, attachée au bien-être, et à l’inclusion sans distinction de nos collaborateurs.">
