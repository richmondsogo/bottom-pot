    <meta name="title" property="og:title" content="Forward Deployed Engineer — Cloud &amp;amp; Agentic AI">
    <meta name="description" property="og:description" content="Job Description: DXC ayuda a empresas globales a ejecutar sus sistemas y operaciones críticos para el negocio mientras moderniza la TI, optimiza las arquitecturas de datos y garantiza la seguridad y la escalabilidad en nubes públicas, privadas e híbridas. Las mayores compañías del mundo y organizaciones del sector público confían en DXC para desplegar servicios que impulsen nuevos niveles de rendimiento, competitividad y experiencia del cliente en todo su entorno de TI. Contamos con más de 125.000 personas en más de 70 países, en las que nuestros clientes confían la entrega de tecnologías transformadoras para garantizar el éxito, la seguridad y el bienestar de empresas y personas en todo el mundo. Creamos soluciones y generamos mejores resultados para los clientes a lo largo de todo su entorno de IT combinando fortalezas y experiencia a nivel global. Descubre más sobre cómo ofrecemos excelencia a clientes y compañeros en DXC.com. En España somos uno de los principales líderes del mercado de TI. Contamos con cerca de 8.000 profesionales, distribuidos en trece localizaciones, con centros de excelencia en tecnologías de última generación como Cloud, Inteligencia de Negocio, IA o Automatización entre otras, que dan servicio a más de 200 clientes de todas las industrias tanto del sector público como privado. Trabajamos con las principales empresas del país que confían en nosotros para guiar y administrar sus agendas digitales y así transformar sus negocios. Desarrollamos políticas activas de diversidad e inclusión laboral de personas con discapacidad y estamos orgullosos de contar con una representación del 49% aproximadamente de mujeres profesionales. En DXC estamos construyendo una plataforma agéntica de operación cloud: agentes de IA que ayudan a diagnosticar, gobernar y automatizar la operación de entornos cloud complejos, siempre con control humano y trazabilidad. Buscamos a la persona que convierta esas ideas en soluciones que funcionan en producción, trabajando codo con codo con el cliente y con un equipo de cloud pública de alta exigencia técnica. Requisitos: Descubrir con el cliente casos de uso reales y convertirlos en especificaciones técnicas. Prototipar y desarrollar agentes y automatizaciones con IA (LLMs, RAG, MCP) y llevarlos a producción. Integrarte en el equipo de cloud pública (Kubernetes, Terraform, redes, seguridad, observabilidad). Guiar la iniciativa técnica y alcanzar acuerdos con arquitectura, seguridad, operaciones y negocio. Documentar patrones reutilizables y compartir lo aprendido con el equipo y el producto. Funciones: 6+ años de experiencia en ingeniería de software, con al menos 3 sobre cloud pública (Azure y/o AWS). Sólida base de desarrollo: 4+ años construyendo software de producción en Python (FastAPI o similar) y TypeScript/React, con buenas prácticas de testing, APIs y revisión de código. Experiencia real construyendo soluciones con LLMs o agentes. Dominio de Kubernetes, Terraform y CI/CD. Experiencia en roles de cara a cliente o con stakeholders múltiples; criterio, comunicación clara y bajo ego. Inglés profesional y español nativo ¿Por qué DXC? Vida en DXC En DXC te incorporarás a una empresa de referencia, con sólidos valores y una cultura people-first basada en la inclusión, el sentido de pertenencia y el aprendizaje. Encontrarás oportunidades reales de desarrollo profesional a través de un trabajo con impacto en proyectos punteros para clientes referentes del mercado, utilizando tecnologías líderes en el sector IT. Apoyamos la flexibilidad y la conciliación, fomentamos un excelente ambiente de trabajo e invertimos en el aprendizaje continuo a través de DXC University, con certificaciones ilimitadas. Actuamos con integridad y un fuerte compromiso con nuestros empleados, construyendo una cultura inclusiva con impacto en la comunidad. Además, es un lugar para construir a largo plazo, con estabilidad y un paquete competitivo de beneficios sociales, para que personas brillantes impulsen su carrera mientras ayudan a nuestros clientes a tener éxito. At DXC Technology, we believe strong connections and community are key to our success. Our work model prioritizes in-person collaboration while offering flexibility to support wellbeing, productivity, individual work styles, and life circumstances. We’re committed to fostering an inclusive environment where everyone can thrive. Recruitment fraud is a scheme in which fictitious job opportunities are offered to job seekers typically through online services, such as false websites, or through unsolicited emails claiming to be from the company. These emails may request recipients to provide personal information or to make payments as part of their illegitimate recruiting process. DXC does not make offers of employment via social media networks and DXC never asks for any money or payments from applicants at any point in the recruitment process, nor ask a job seeker to purchase IT or other equipment on our behalf. More information on employment scams is available here. DXC Technology (NYSE: DXC) is a leading enterprise technology and innovation partner delivering software, services, and solutions to global enterprises and public sector organizations — helping them harness AI to drive outcomes at a time of exponential change with speed. With deep expertise in Managed Infrastructure Services, Application Modernization, and Industry-Specific Software Solutions, DXC modernizes, secures, and operates some of the world&#39;s most complex technology estates. Learn more on dxc.com.">
