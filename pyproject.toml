[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"src/api/**" = ["BLE001"]
"src/ats/**" = ["BLE001"]
"src/core/**" = ["BLE001"]
"src/discovery/**" = ["BLE001"]
"src/extraction/**" = ["BLE001"]
"src/project_files/**" = ["BLE001"]
"tests/**" = ["BLE001"]
"scripts/**" = ["BLE001"]
"main.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
markers = [
    "offline: Hermetic test that must run without real DNS or external network access.",
    "live: Opt-in test that requires real DNS or live external network access.",
    "e2e: End-to-end test exercising the browser or full server stack.",
]
