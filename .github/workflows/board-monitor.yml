name: Board Monitor Refresh

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger-board-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/cron/monitor
        env:
          BOTTOM_POT_URL: ${{ vars.BOTTOM_POT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${BOTTOM_POT_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping board monitor refresh: set repository variable BOTTOM_POT_URL and secret CRON_SECRET first."
            exit 0
          fi
          curl -fsS --max-time 280 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BOTTOM_POT_URL%/}/api/cron/monitor?max_boards=10"
          echo ""
